# *************************************************************************
# *************************************************************************

#-------------------------------------------------------------------------#
#----------------------- Quarkus - Configuration -------------------------#
#-------------------------------------------------------------------------#

#--------------------------- Core Configuration --------------------------#

quarkus.http.port=8081

#---------------------- Console login configuration ----------------------#

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-3p [%c{3.}] (%t) %s%e%n
quarkus.console.color=true

#------------------------ Datasource Configuration -----------------------#

# Supabase
quarkus.datasource.db-kind=PostgreSQL
quarkus.datasource.jdbc.url=jdbc:postgresql://${BANK_URL_FINANCIAL}/${BANK_DB_NAME}
quarkus.datasource.username=${BANK_USERNAME_FINANCIAL}
quarkus.datasource.password=${BANK_PASSWORD_FINANCIAL}
quarkus.hibernate-orm.schema-management.strategy=update

#-------------------------- Auth Configuration ---------------------------#

CONSTANT.ACCOUNT-SERVICE.AUTH.API-KEY:${BANK_AUTH_API_KEY}

#-------------------------------- Swagger --------------------------------#

quarkus.swagger-ui.path=swagger
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.display-operation-id=true
quarkus.swagger-ui.default-models-expand-depth=0
quarkus.swagger-ui.theme=original
quarkus.swagger-ui.title=Swagger | ACCOUNTS-SERVICE | UNI-SANTO-TOMAS
quarkus.swagger-ui.footer=© 2026 UNI-SANTO-TOMAS | All rights reserved

#--------------------------------- OpenAPI -------------------------------#

quarkus.smallrye-openapi.operation-id-strategy=CLASS_METHOD
quarkus.smallrye-openapi.info-title=ACCOUNTS-SERVICE
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-contact-email=samantha@santoto.com
quarkus.smallrye-openapi.info-contact-name=SANTO-TOMAS
quarkus.smallrye-openapi.info-contact-url=https://usantotomas.edu.co
quarkus.smallrye-openapi.info-description=Microservicio para Gestión Financiera. CLIENTES | CUENTAS
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html
